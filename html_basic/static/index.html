<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>EnvAI 控制台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;height:100vh;overflow:hidden;background:#f7f8fa;color:#333}
/* 侧边栏 */
.sidebar{
    width:240px;
    background:linear-gradient(180deg, #2b303b 0%, #1f232b 100%);
    color:#fff;
    transition:width 0.3s ease;
    overflow:hidden;
    box-shadow: 2px 0 12px rgba(0,0,0,0.12);
}
.sidebar.collapse{width:54px}
/* 汉堡头部 */
.hamburger{
    height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    cursor:pointer;
    border-bottom:1px solid #3c424f;
    user-select:none;
}
.hamburger:hover{background:rgba(255,255,255,0.08)}
/* 菜单项 */
.menu-item{
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-bottom:1px solid #343944;
    transition:background 0.2s ease;
    user-select:none;
}
.menu-item:hover{background:rgba(255,255,255,0.08)}
.short{display:inline;}
.full{display:none;white-space:nowrap}
/* 展开状态切换文字 */
.sidebar:not(.collapse) .short{display:none;}
.sidebar:not(.collapse) .full{display:inline;}

/* 主内容区 */
.main{flex:1;overflow:hidden}
iframe{width:100%;height:100%;border:none;background:#fff;}
</style>
</head>
<body>
<div class="sidebar collapse" id="side">
    <div class="hamburger" onclick="toggleSide()">☰</div>
    <div class="menu-item" onclick="switchPage('sleep_eval.html')">
        <span class="short">图</span>
        <span class="full">用图片识别</span>
    </div>
    <div class="menu-item" onclick="switchPage('video_stream.html')">
        <span class="short">视</span>
        <span class="full">视频识别</span>
    </div>
</div>
<div class="main">
    <iframe id="frame" src="sleep_eval.html"></iframe>
</div>
<script>
function toggleSide(){
    const s = document.getElementById('side')
    s.classList.toggle('collapse')
}
function switchPage(url){
    document.getElementById('frame').src = url
}
</script>
</body>
</html>
