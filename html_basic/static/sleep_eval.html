<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GoodSleep 睡眠环境评估</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, BlinkMacSystemFont, sans-serif}
body{background:#f0f4f9;padding:24px;color:#222;line-height:1.65}
.page-title{font-size:24px;font-weight:500;margin-bottom:6px;color:#1f2937}
.page-subtitle{font-size:15px;color:#64748b;margin-bottom:28px}
.wrap{display:grid;grid-template-columns: 1fr 1fr;gap:24px;max-width:1400px}
.card{background:#ffffff;border-radius:14px;padding:24px;box-shadow:0 1px 6px rgba(0,0,0,0.07)}
/* 上传拖拽区域 */
.upload-area{position:relative;border:1px dashed #b8c2d4;border-radius:10px;padding:16px;text-align:center;cursor:pointer;min-height:220px;display:flex;align-items:center;justify-content:center}
.upload-area p{color:#64748b}
.upload-area.active{border-color:#2563eb;background:#eff6ff}
.upload-area img{max-width:100%;max-height:260px;border-radius:8px;display:block}
.upload-area:has(img){cursor:pointer}
.upload-loading-mask{display:none;position:absolute;inset:0;background:rgba(255,255,255,0.6);border-radius:10px;align-items:center;justify-content:center;color:#333;font-weight:500}
.upload-area.loading .upload-loading-mask{display:flex}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.param-item label{display:block;font-size:14px;color:#475569;margin-bottom:4px}
.param-item input,.param-item select{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
.tip-text{font-size:13px;color:#64748b;margin:8px 0 20px}
#runAll{width:100%;padding:12px 0;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer}
#runAll:hover{background:#1d4ed8}
#runAll:disabled{background:#94a3b8;cursor:not-allowed}
#msg{margin:12px 0;font-size:14px;min-height:20px}
.info{color:#2563eb}
.error{color:#dc2626}
.success{color:#10b981}
/* 右侧结果卡片 */
.risk-tag{display:inline-block;padding:4px 10px;border-radius:999px;color:#fff;font-size:14px;font-weight:500;margin-bottom:6px}
.risk-low{background:#10b981}
.risk-medium{background:#f59e0b}
.risk-high{background:#dc2626}
.risk-none{background:#9ca3af}
.risk-sub{font-size:14px;color:#64748b;margin-bottom:14px}
.result-title{font-size:16px;font-weight:500;margin-bottom:6px}
.result-block{margin-bottom:12px}
.trace-block{background:#f1f5f9;padding:12px;border-radius:8px;font-size:13px;color:#64748b;margin:14px 0}
.raw-toggle{font-size:13px;color:#2563eb;cursor:pointer;margin:10px 0;display:inline-block}
.raw-box{display:none;background:#f1f5f9;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;max-height:220px;overflow:auto;color:#555}
.raw-box.show{display:block}
.footer-note{grid-column:1/-1;margin-top:16px;font-size:13px;color:#ca8a04}
.wrap{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:24px;
    max-width:1400px;
}
@media (max-width: 768px) {
    body {
        padding: 16px;
    }
    .page-title {
        font-size: 20px;
    }
    .card {
        padding: 16px;
    }
    .back-btn {
        padding: 8px 14px;
    }
    .wrap {
        grid-template-columns: 1fr;
    }
}

</style>
</head>
<body>
<div class="page-title">GoodSleep 睡眠环境评估</div>
<div class="page-subtitle">卧室人居环境视觉 + 贝叶斯风险评估（本地AI推理）</div>
<div class="wrap">
  <!-- 左侧：上传和参数 -->
  <div class="card">
    <div class="upload-area" id="uploadBox">
      <p id="uploadTip">点击或者拖拽图片到此处上传</p>
      <input type="file" id="imgFile" accept="image/*" hidden>
      <div class="upload-loading-mask">评估中...</div>
    </div>
    <div class="param-row">
      <div class="param-item">
        <label>温度 ℃</label>
        <input id="temp" type="number" value="18" placeholder="例：20">
      </div>
      <div class="param-item">
        <label>相对湿度 RH %</label>
        <input id="hum" type="number" value="50" placeholder="例：55">
      </div>
    </div>
    <div class="param-item">
      <label>睡眠时段</label>
        <select id="sleep_start_hour">
          <option value="21">21:00</option>
          <option value="22">22:00</option>
          <option value="23" selected>23:00</option>
          <option value="0">00:00</option>
          <option value="1">01:00</option>
          <option value="2">02:00</option>
          <option value="3">03:00</option>
        </select>
    </div>

    <div class="tip-text">参数全部填写，启用图像+环境联合评估；留空仅图像推理</div>
    <button id="runAll">一键评估</button>
    <div id="msg"></div>
  </div>

  <!-- 右侧：结果面板 -->
  <div class="card" id="resultCard">
    <div style="color:#94a3b8">评估结果将在这里展示</div>
  </div>
</div>
<div class="footer-note">⚠️ 提示：本系统仅作为人居环境辅助评估，不能替代专业环境检测</div>

<script>
const VISION_API = "http://127.0.0.1:8000/api/v1/sleep/vision";
const EVAL_API = "http://127.0.0.1:8000/api/v1/sleep/eval";

const imgFile = document.getElementById("imgFile");
const uploadBox = document.getElementById("uploadBox");
const uploadTip = document.getElementById("uploadTip");
const tempEl = document.getElementById("temp");
const humEl = document.getElementById("hum");
const sleepStartHourEl = document.getElementById("sleep_start_hour");
const runBtn = document.getElementById("runAll");
const msgBox = document.getElementById("msg");
const resultCard = document.getElementById("resultCard");

// 拖拽上传
uploadBox.onclick = ()=>imgFile.click();
uploadBox.ondragover = e=>{e.preventDefault();uploadBox.classList.add("active")};
uploadBox.ondragleave = ()=>uploadBox.classList.remove("active");
uploadBox.ondrop = e=>{
  e.preventDefault();
  uploadBox.classList.remove("active");
  if(e.dataTransfer.files[0]) imgFile.files = e.dataTransfer.files;
  imgFile.onchange();
}

imgFile.onchange = ()=>{
  const f = imgFile.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = e=>{
    uploadTip.style.display = "none";
    uploadBox.innerHTML = `<img src="${e.target.result}" alt="预览" onerror="this.outerHTML='<span style=color:#999>图片加载失败</span>'">
    <input type="file" id="imgFile" accept="image/*" hidden>
    <div class="upload-loading-mask">评估中...</div>`;
    // 重新绑定input
    const newInput = document.getElementById("imgFile");
    newInput.onchange = imgFile.onchange;
  }
  r.readAsDataURL(f);
}
function setMsg(text,cls="info"){
  msgBox.textContent = text;
  msgBox.className = cls;
}
function renderResult(res){
  resultCard.innerHTML = `
    <div class="risk-tag ${res.riskClass}">${res.riskLevel}</div>
    <div class="risk-sub">综合评估结果：${res.riskLevel}</div>
    <div class="result-block">
      <div class="result-title">风险描述</div>
      <div>${res.desc}</div>
    </div>
    <div class="result-block">
      <div class="result-title">整改建议</div>
      <div style="color:#2563eb">${res.suggest}</div>
    </div>
    <div class="trace-block">
      风险p：${res.bayes.posterior}<br/>
      推理链路：${res.bayes.trace.join("；")}<br/>
      证据数量：${res.bayes.evidence_count}
    </div>
    <div class="raw-toggle" id="rawToggle">展开原始返回</div>
    <div class="raw-box" id="rawContent">${JSON.stringify(res,null,2)}</div>
  `;
  document.getElementById("rawToggle").onclick = function(){
    const rawDom = document.getElementById("rawContent");
    rawDom.classList.toggle("show");
    this.innerText = rawDom.classList.contains("show") ? "收起原始返回" : "展开原始返回";
  }
}

runBtn.onclick = async ()=>{
  const file = imgFile.files[0];
  if(!file){
    setMsg("请先选择图片","error");
    return;
  }
  runBtn.disabled = true;
  uploadBox.classList.add("loading");
  setMsg("正在调用视觉识别...");
  try{
    const fd = new FormData();
    fd.append("img_file",file);
    fd.append("temperature",tempEl.value);
    fd.append("humidity",humEl.value);
    const vRes = await fetch(VISION_API,{method:"POST",body:fd});
    const vJson = await vRes.json();
    if(!vRes.ok) throw new Error("Vision失败："+JSON.stringify(vJson));
    const visionData = vJson.data;
    if(visionData.raw_text !== undefined){
      visionData.__raw_text__ = visionData.raw_text;
      delete visionData.raw_text;
    }
    setMsg("视觉解析完成，正在评估睡眠环境...");
    const payload = {
      temperature: tempEl.value.trim() ? Number(tempEl.value) : null,
      humidity: humEl.value.trim() ? Number(humEl.value) : null,
      co2: null,
      noise: null,
      illuminance: null,
      sleep_start_hour: sleepStartHourEl.value.trim(),
      mold_risk_level: null,
      vision_obs: visionData
    };
    console.log("payload ===> ", payload)

    const eResp = await fetch(EVAL_API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    const eJson = await eResp.json();
    if(!eResp.ok) throw new Error(JSON.stringify(eJson));
    setMsg("评估完成","success");
    renderResult(eJson);
  }catch(e){
    setMsg(e.message,"error");
  }finally{
    runBtn.disabled = false;
    uploadBox.classList.remove("loading");
  }
}
</script>
</body>
</html>
